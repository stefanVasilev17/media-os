spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/media_os}
    username: ${DATABASE_USER:media_os}
    password: ${DATABASE_PASSWORD:media_os}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
