spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/media_os}
    username: ${DATABASE_USER:media_os}
    password: ${DATABASE_PASSWORD:media_os}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  forward-headers-strategy: framework
