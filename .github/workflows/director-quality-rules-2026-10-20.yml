name: Architectural Thinking Director quality rules 2026-10-20
on:
  push:
    branches: [main]
    paths: ['.github/workflows/director-quality-rules-2026-10-20.yml']
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Register Director corrections in MediaOS production memory
        run: |
          python3 - <<'PY'
          import json,urllib.request
          base="https://media-os-backend-production.up.railway.app"
          corrections=[
            ("VISUAL","Avoid decorative microcopy: no LIVE EXAMPLE counters, tiny footers, disclaimer captions, editing metadata or nonessential labels. Show only legible architecture nodes, concrete causes, meaningful states, request paths and results."),
            ("VISUAL","Use one continuous authored Living Architecture Map and the same canonical green request. Animate one fact at a time, preserve navigation while the center focus changes, use controlled camera moves and comprehension holds. Keep diagnostic failures separate from the canonical request."),
            ("SCRIPT","Teach through concrete, production-realistic stories: where is the request, what problem arises, what observable consequence follows, why does it happen, and what resolves it. Introduce technical names after intuitive visual understanding. Respect configuration-dependence without boilerplate screen disclaimers."),
            ("VISUAL","EP001 SHOT 06 Load Balancer must match or exceed Director-LOCKED SHOT 05: one ingress, several Auth Service instances, eligibility from health checks, coherent route choice, meaningful failure or timeout examples, one selected target, no decorative microtext, seamless handoff to Auth Service."),
            ("ALL","Preserve Director-approved scripts, audio, shots and precise green-packet continuity. No unapproved re-render or rewrite of LOCKED shots. Agents implement, verify and show preview; Director alone approves the final visual LOCK.")
          ]
          for scope,rule in corrections:
              payload=json.dumps({"scope":scope,"content":rule,
                "source":"Director-approved production standard 2026-10-20"}).encode()
              req=urllib.request.Request(base+"/api/v1/production-memory/corrections",
                data=payload,method="POST",headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=40) as response:
                  result=json.load(response)
              assert result["scope"]==scope
              print("REGISTERED",scope,result.get("id"),flush=True)
          PY
