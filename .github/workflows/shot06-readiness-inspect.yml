name: EP001 SHOT06 source and voice readiness inspection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shot06-readiness-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read live SHOT06 approved voice and visual contract
        run: |
          python3 - <<'PY'
          import urllib.request,json
          B="https://media-os-backend-production.up.railway.app"
          for name,path in (("VOICE","/api/v1/voice/shots?scriptRevision=3"),
                            ("CLIPS","/api/v1/voice-clips?scriptRevision=3"),
                            ("VISUAL","/api/v1/visual/state?scriptRevision=3")):
              with urllib.request.urlopen(B+path,timeout=40) as r: raw=json.load(r)
              if name=="VOICE":
                  rows=[x for x in raw if x["shotKey"]=="SHOT 06"]
                  for r in rows:
                      print("SHOT06_VOICE",json.dumps({k:v for k,v in r.items() if k in
                        ("shotKey","voiceGenerated","voiceApproved","visualSyncReady","generationRevision","alignment","narration")},default=str)[:13000],flush=True)
              elif name=="CLIPS":
                  rows=[x for x in raw if x.get("shotKey")=="SHOT 06"]
                  print("SHOT06_CLIPS",json.dumps([{k:v for k,v in x.items() if k in
                   ("clipKey","sequence","generated","approved","durationSeconds","leadingTrimSeconds","playbackEndSeconds","generationRevision","narration","generatedAt","approvedAt")} for x in rows]),flush=True)
                  print("SHOT06_ALIGNMENT_META",json.dumps([{"clip":x["clipKey"],"keys":list(x.get("generatedAlignment",{}).keys()),"hasZoneExplanation":"A zone is a separate" in x.get("narration","")} for x in rows]),flush=True)
              else:
                  row=next(x for x in raw["shots"] if x["shotKey"]=="SHOT 06")
                  print("SHOT06_VISUAL",json.dumps({k:v for k,v in row.items() if k in
                    ("shotKey","compositionId","renderId","locked","qaStatus","voiceReady","durationSeconds")}),flush=True)
          import re
          with urllib.request.urlopen(B+"/api/v1/voice/shots?scriptRevision=3",timeout=40) as response:
              live=json.load(response)
          aggregate=next(r for r in live if r["shotKey"]=="SHOT 06")
          aligned=aggregate.get("alignment",{}).get("words",[])
          def norm(x):
              return re.sub(r"[^a-z0-9]","",str(x).lower())
          spoken=[norm(w.get("text","")) for w in aligned]
          phrases=[
            "The API Gateway has cleared our request",
            "There are three running copies of Auth Service",
            "Which one should receive our login",
            "That's the Load Balancer's job",
            "One incoming request",
            "Send everything to the same server",
            "The Load Balancer uses configured traffic distribution rules",
            "Here's one possible rule Round Robin",
            "Watch three separate example requests",
            "The first goes to Instance A",
            "The second goes to B",
            "And the third goes to C",
            "But distributing traffic isn't always that simple",
            "Sometimes related requests should reach the same server",
            "That's where a Hash Key can help",
            "two example requests carrying the same stable key",
            "Same key Same destination",
            "And availability is about to become a problem",
            "Watch Instance C",
            "The Load Balancer sends a health probe",
            "No response",
            "Another probe times out",
            "After the configured failure threshold is reached",
            "Instance C is marked unhealthy",
            "Its route disappears from the eligible pool",
            "Three possible destinations have become two",
            "Now return to our original green login request",
            "It's been waiting at the entrance this entire time",
            "Instance C is out A and B are still healthy",
            "Under this system's routing rule",
            "A zone is a separate part of the cloud infrastructure",
            "if one zone experiences a failure",
            "One request One eligible destination One chosen path",
            "And now our request finally moves",
            "Our request has reached Auth Service",
            "It never checked the password",
            "It only chose which healthy server would receive the request",
            "Now comes the real question",
            "Can that server actually trust the credentials"
          ]
          for phrase in phrases:
              search=[norm(t) for t in phrase.split()]
              hits=[i for i in range(len(spoken)-len(search)+1)
                    if spoken[i:i+len(search)]==search]
              if hits:
                  i=hits[0]
                  print("ANCHOR",json.dumps({"phrase":phrase,"start":aligned[i]["start"],
                    "end":aligned[i+len(search)-1]["end"]}),flush=True)
              else:
                  print("ANCHOR_NOT_FOUND",phrase,flush=True)
          PY
