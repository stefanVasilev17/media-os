name: SHOT06 v5 Record Final Director Video and Voice LOCK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shot06-v5-record-final-director-lock.yml'
permissions:
  contents: write
jobs:
  final-director-lock-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: shot06-director-v5-map-hold-2026-10-21
    steps:
      - uses: actions/checkout@v4
      - name: Validate the existing v5 release asset without touching it
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release-before.json"
          jq -e '
            (.assets | length) == 1 and
            .assets[0].name == "SHOT06_LoadBalancer_Director_v5_MapHold_7p5sec.mp4" and
            .assets[0].size > 1000000 and
            .assets[0].digest != null
          ' "$RUNNER_TEMP/release-before.json" >/dev/null
          jq -r '.assets[0] | [.name,.digest,.size] | @tsv' "$RUNNER_TEMP/release-before.json"
      - name: Record the final Director LOCK without editing the MP4
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/director-lock-notes.md" <<'EOF'
          # EP001 SHOT 06 v5 — DIRECTOR FINAL VIDEO + VOICE LOCK

          **Explicit Director approval: 2026-10-21 — "Готови сме. LOCK!!!"**

          **STATUS: DIRECTOR VIDEO LOCKED v5; DIRECTOR VOICE LOCKED C01–C07.** The final approved design stays on the full Living Architecture Map until **7.5s (frame 225)**, reveals the Load Balancer detail over **7.5–9.5s (frames 225–285)**, and is fully in the detail panel at **10s**. Preserve all previous collision corrections, routing flows, and original seven voices.

          **Exact Director-reviewed full-quality reference:** `SHOT06_v5_LongMapOpening_7p5_to_9p5_FULL_WITH_SOUND.mp4`, SHA-256 `6e96f65d27a1dfd0ea3e6dde2343c444af81900d6dc4c324c6ab78ff361a3e57`, 10,518,165 bytes, 171.243s, 1280x720, 30 FPS, H264/AAC. Its AAC stream SHA-256 `676f4c81e4922e728516b3941c0fa0d9b6a71d00453b7d3841d4c2d136ae706b` is bit-identical to v3, preserving all seven approved narration clips unchanged.

          **Important artifact distinction:** The MP4 attached to this GitHub Release is an independently rendered Remotion v5 candidate with the approved **same map-hold timing/visual specification**, but its file hash differs from the exact video watched by Director. Do **not** claim it is byte-identical to the reference or overwrite the reference. Verify MediaOS's native 1080p render against the approved design and audio before native locking.

          **Production source already pushed to GitHub `main`:** `remotion-engine/src/episodes/ep001/live-diagram/LoadBalancerYoutubePreview.tsx`, design commit `4ad9ebc9ec8f073f83dc8917a1392f46bf8e8512`. SHOT 01–05 remain Director LOCKED; do not change them.

          **RAILWAY BLOCKER / PENDING ACTION:** Railway currently skips new builds for production backend and render worker (`Deploys have been paused temporarily`). **After Railway recovers deploy fresh latest `main` to both services** (do not Redeploy an old build), then native render/QA SHOT06 v5 and add it to the cumulative preview with SHOT01–05 protected. Do not mark an old v3/v4 MediaOS render as Director-LOCKED v5.

          **Durable handoff / tracking:** https://github.com/stefanVasilev17/media-os/issues/89

          No automatic monitoring was requested or enabled. This release is a record of the Director's final approval of the reviewed video and unchanged voices.
          EOF
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/director-lock-notes.md"
      - name: Verify only release notes changed; preserve exact release asset
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release-after.json"
          jq -e '.body | contains("DIRECTOR FINAL VIDEO + VOICE LOCK") and contains("issues/89")' "$RUNNER_TEMP/release-after.json" >/dev/null
          jq -S '[.assets[] | {name,digest,size,id}]' "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/before-assets.json"
          jq -S '[.assets[] | {name,digest,size,id}]' "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/after-assets.json"
          cmp "$RUNNER_TEMP/before-assets.json" "$RUNNER_TEMP/after-assets.json"
          echo "SHOT06_V5_DIRECTOR_VIDEO_AND_VOICE_LOCK_RECORDED_WITHOUT_ASSET_MUTATION"
