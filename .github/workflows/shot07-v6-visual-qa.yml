name: SHOT07 v6 Auth panel visibility QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shot07-v6-visual-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Wait for exact SHOT07 v6 Director DRAFT MP4
        shell: bash
        run: |
          set -euo pipefail
          url="https://media-os-backend-production.up.railway.app/api/v1/remotion/renders/f8ad727b-34ab-4410-a6de-356d81a31763/video"
          for attempt in $(seq 1 60); do
            if curl -fsSL --max-time 45 "$url" -o shot07_v6.mp4 && \
                ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 shot07_v6.mp4 | grep -q '^1920,1080$'; then
              echo "Exact v6 1080p video retrieved"
              exit 0
            fi
            sleep 20
          done
          echo "v6 video was not ready for visual QA during this run" >&2
          exit 1
      - name: Extract in-shot video frames
        shell: bash
        run: |
          mkdir -p frames
          for t in 15 50 82 112 150; do
            ffmpeg -v error -ss "$t" -i shot07_v6.mp4 -frames:v 1 -update 1 "frames/sec_${t}.png"
          done
      - name: Assert Auth Service full-screen title visibly opens
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          def whites(path):
              image=Image.open(path).convert('RGB')
              return sum(min(pixel)>210 for pixel in image.crop((650,70,1270,257)).getdata())
          samples={seconds:whites(Path(f'frames/sec_{seconds}.png')) for seconds in [15,50,82,112,150]}
          for seconds,count in samples.items():
              print(f'{seconds}s: visible light text pixels in Auth title region: {count}')
          for seconds in (15,50,82,112):
              if samples[seconds]<900:
                  raise SystemExit(f'VISUAL QA FAIL: Auth Service title not visible at {seconds}s; map may be occluding the screen')
          print('VISUAL QA PASS: title remains prominent through core Auth explanation')
          PY
      - name: Preserve independent Director QA stills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep001-shot07-v6-director-frame-probes
          path: frames/
          if-no-files-found: ignore
          retention-days: 14
