name: SHOT05 Director-approved voice handoff to legacy Visual
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shot05-legacy-voice-handoff-smoke.yml']
permissions:
  contents: read
concurrency:
  group: shot05-safe-legacy-voice-handoff
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Activate Director-approved seven-clip voice with original C01 archive and verify legacy Visual QA
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,time,urllib.request,urllib.error
          from urllib.parse import quote
          B="https://media-os-backend-production.up.railway.app"
          def req(path,body=None,raw=False):
              payload=None if body is None else json.dumps(body).encode()
              request=urllib.request.Request(B+path,data=payload,method="POST" if body is not None else "GET",
                  headers={"Content-Type":"application/json","Accept":"application/json"})
              with urllib.request.urlopen(request,timeout=45) as r:
                  assert r.status==200
                  data=r.read()
                  return data if raw else json.loads(data)
          shots=req("/api/v1/studio/shots")
          originals=[s for s in shots if s.get("sourceShotKey")=="SHOT 05" and s.get("shotNumber")==5]
          assert len(originals)==1,"Expected exactly one approved original SHOT 05 working copy"
          studio=originals[0]
          rev=int(studio["sourceScriptRevision"])
          assert rev==3,"Do not activate on unexpected Script revision"
          clips=sorted(studio["clips"],key=lambda x:x["sequence"])
          assert len(clips)==7 and all(c.get("approvedAt") and c.get("generated") for c in clips)
          legacy=sorted([c for c in req("/api/v1/voice-clips?scriptRevision="+str(rev))
                if c["shotKey"]=="SHOT 05"],key=lambda x:x["sequence"])
          assert len(legacy)==7
          for i in range(1,7):
              a,b=legacy[i],clips[i]
              assert a["sequence"]==b["sequence"] and a["narration"]==b["narration"] and a["voiceDirection"]==b["voiceDirection"]
              src=req("/api/v1/voice-clips/"+quote(a["clipKey"],safe="")+"/audio?scriptRevision="+str(rev),raw=True)
              approved=req("/api/v1/studio/clips/"+b["id"]+"/audio?v="+str(b["generationRevision"]),raw=True)
              assert hashlib.sha256(src).digest()==hashlib.sha256(approved).digest(),"Audio mismatch at "+a["clipKey"]
          assert clips[0]["voiceDirection"]==legacy[0]["voiceDirection"],"C01 performance direction mismatch"
          visual=req("/api/v1/visual/state?scriptRevision="+str(rev))
          shot=next(s for s in visual["shots"] if s["shotKey"]=="SHOT 05")
          assert not shot["locked"],"Never modify a Director LOCKED shot"
          orig_studio=[(x["id"],x["narration"],x["generationRevision"],x["approvedAt"]) for x in clips]
          print("DIRECTOR PREFLIGHT: C01 updated/Director-approved in Studio; C02–C07 byte-identical; all 7 approved; original SHOT05 video not locked.",flush=True)
          for attempt in range(42):
              try:
                  result=req("/api/v1/voice-clips/shots/SHOT%2005/activate-approved-studio-voice",
                             {"scriptRevision":rev,"directorConfirmed":True})
                  break
              except urllib.error.HTTPError as e:
                  payload=e.read().decode()[:1000]
                  if e.code!=404 or attempt==41:raise RuntimeError(f"Safe handoff failed: HTTP {e.code} {payload}")
                  if attempt%6==0:print("Waiting for backend deployment of pinned Director handoff endpoint...",flush=True)
                  time.sleep(15)
          assert result["ready"] is True and result["legacyApprovedClips"]==7
          assert result["legacyVisualSyncReady"] is True
          assert result["directorLocksPreserved"] is True
          current=req("/api/v1/voice-clips?scriptRevision="+str(rev))
          active=sorted([x for x in current if x["shotKey"]=="SHOT 05"],key=lambda x:x["sequence"])
          assert len(active)==7 and all(c["approved"] and c["generated"] for c in active)
          for a,b in zip(active,clips):
              assert a["narration"]==b["narration"] and a["voiceDirection"]==b["voiceDirection"]
          after=req("/api/v1/studio/shots")
          copy=next(s for s in after if s["id"]==studio["id"])
          assert [(x["id"],x["narration"],x["generationRevision"],x["approvedAt"])
                  for x in sorted(copy["clips"],key=lambda x:x["sequence"])]==orig_studio
          voice=req("/api/v1/voice/shots?scriptRevision="+str(rev))
          v=next(x for x in voice if x["shotKey"]=="SHOT 05")
          assert v["voiceApproved"] and v["visualSyncReady"]
          alignment=v.get("alignment") or {}
          assert 50<float(alignment.get("durationSeconds",0))<180
          anchors=alignment.get("anchors") or {}
          assert all(k in anchors for k in ["API_GATEWAY","PATH","METHOD","RATE_LIMIT","REQUEST_FILTER","WAF","SCHEMA"]),anchors
          assert not alignment.get("unresolvedAnchors"),alignment.get("unresolvedAnchors")
          qa=req("/api/v1/visual/qa/preflight",{"scriptRevision":rev,"shotKey":"SHOT 05","technicalRerender":False})
          print("LEGACY_PRE_FLIGHT",json.dumps(qa.get("checks"),ensure_ascii=False),flush=True)
          assert qa["passed"] is True,"Legacy Visual Agent preflight must pass after voice bridge"
          print("PASS: SHOT 05 legacy Visual preflight all green; voice duration",alignment["durationSeconds"],
                "anchors",len(anchors),"studio C01 archive",result["previousC01Archived"],flush=True)
          print("All Director-approved Studio clips unchanged. Old C01 archive preserved. Original locked video files untouched. No TTS or render.",flush=True)
          PY
