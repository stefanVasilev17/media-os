name: SHOT05 Director Preview isolated render QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-director-plan-render-qa.yml'
permissions:
  contents: read
jobs:
  isolated-video-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Queue voice-synchronized Director preview and verify playable MP4 without touching original
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          BASE="https://media-os-backend-production.up.railway.app"
          def call(path,payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(BASE+path,data=body,
                  method="GET" if body is None else "POST",
                  headers={"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=35) as r:
                      assert r.status==200
                      return json.load(r)
              except urllib.error.HTTPError as exc:
                  print("API ERROR",path,exc.code,exc.read().decode()[:1600],flush=True)
                  raise
          sources=call("/api/v1/studio/shots")
          shot=[x for x in sources if x.get("sourceShotKey")=="SHOT 05"]
          assert len(shot)==1,"No unique Director working shot 05"
          s=shot[0]
          assert len(s["clips"])==7 and all(c["approvedAt"] for c in s["clips"])
          snapshot=[(c["id"],c["scriptRevision"],c["generationRevision"],c["approvedAt"]) for c in s["clips"]]
          plan=call("/api/v1/studio/shots/"+s["id"]+"/visual-plan")
          assert plan["ready"] is True,"Voice-approved validated plan required before render"
          assert len(plan["plan"]["events"])==7
          print("Director plan ready; queuing only separate Studio Director preview.",flush=True)
          q=call("/api/v1/studio/shots/"+s["id"]+"/render-director-plan",{})
          rid=q.get("renderId")
          assert rid and q.get("compositionId")=="EP001-Studio-DirectorPlan",q
          print("Isolated render job:",rid,"state:",q.get("status"),flush=True)
          for attempt in range(85):
              info=call("/api/v1/remotion/renders/"+rid)
              state=info.get("status")
              if attempt%5==0:print("Preview",rid,state,"progress",info.get("progress"),flush=True)
              if state=="READY":break
              if state=="FAILED":raise RuntimeError("Director preview render failed: "+str(info.get("error"))[:1400])
              time.sleep(10)
          else: raise TimeoutError("Render queued but did not finish in QA window. Video remains separate and can finish later.")
          url=BASE+"/api/v1/remotion/renders/"+rid+"/video"
          req=urllib.request.Request(url,method="GET",headers={"Range":"bytes=0-15"})
          with urllib.request.urlopen(req,timeout=40) as response:
              prefix=response.read(32)
              assert b"ftyp" in prefix,"Preview does not appear to be a valid MP4"
              assert response.status in (200,206)
          after=call("/api/v1/studio/shots")
          current=[x for x in after if x.get("id")==s["id"]][0]
          assert [(c["id"],c["scriptRevision"],c["generationRevision"],c["approvedAt"])
                  for c in current["clips"]]==snapshot,"Working Director approval/voice changed!"
          assert current.get("previewRenderId")==rid,"Wrong isolated draft render reference"
          print("ISOLATED DIRECTOR MP4 READY",rid,"duration",info.get("durationInFrames"),"frames",flush=True)
          print("Director video LOCK not touched; old compositions and original audio remain unchanged.",flush=True)
          print("Preview URL:",url,flush=True)
          PY
