name: EP001 Shot Studio reuse original voices
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shot05-studio-reuse-voice-smoke.yml'
permissions:
  contents: read
concurrency:
  group: ep001-studio-safe-voice-reuse
  cancel-in-progress: false
jobs:
  reuse-existing-approved-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Safely reuse source voice bytes only in the already-locked SHOT 05 Studio working copy
        shell: bash
        run: |
          python3 - <<'PY'
          import copy, json, time, urllib.request, urllib.error
          BASE="https://media-os-backend-production.up.railway.app"
          def req(path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              request=urllib.request.Request(BASE+path,
                  data=data,method="GET" if data is None else "POST",
                  headers={"Accept":"application/json","Content-Type":"application/json"})
              with urllib.request.urlopen(request,timeout=35) as r:
                  assert r.status==200,(path,r.status)
                  return json.load(r)
          def get_shot():
              rows=req("/api/v1/studio/shots")
              matching=[x for x in rows if x.get("sourceShotKey")=="SHOT 05" and x.get("shotNumber")==5]
              assert len(matching)==1,"Exactly one source-linked SHOT 05 working copy must exist"
              shot=matching[0]
              clips=sorted(shot["clips"],key=lambda x:x["sequence"])
              assert len(clips)==7 and [x["sequence"] for x in clips]==list(range(1,8))
              assert clips[0]["approvedAt"] is not None,"Protect the Director-approved working C01"
              return shot,clips
          for attempt in range(45):
              try:
                  pre,old=get_shot()
                  if "sourceScriptRevision" not in pre: raise urllib.error.HTTPError(BASE,404,"waiting",None,None)
                  break
              except (urllib.error.HTTPError,TimeoutError) as exc:
                  if attempt==44: raise
                  if attempt%5==0:print("Waiting for new Studio backend:",type(exc).__name__,flush=True)
                  time.sleep(17)
          source_revision=int(pre["sourceScriptRevision"])
          assert source_revision>=3 and pre["sourceShotKey"]=="SHOT 05"
          canonical=req("/api/v1/voice-clips?scriptRevision="+str(source_revision))
          originals={x["sequence"]:x for x in canonical if x.get("shotKey")=="SHOT 05"}
          assert len(originals)==7,"Original source voices must remain intact"
          source_before={n:{"narration":v["narration"],"generated":v["generated"],
                   "approved":v["approved"],"generationRevision":v["generationRevision"],
                   "approvedAt":v["approvedAt"]} for n,v in originals.items()}
          print("Preflight PASS: 7 original source clips plus 7 working clips; C01 voice Director-approved.",flush=True)
          print("Original voice generated:",sum(bool(v["generated"]) for v in originals.values()),
                "Director-approved:",sum(bool(v["approved"]) for v in originals.values()),flush=True)
          c01=copy.deepcopy(old[0])
          response=req("/api/v1/studio/shots/"+pre["id"]+"/reuse-existing-voices",{})
          assert isinstance(response.get("reusedClips"),int),response
          after,updated=get_shot()
          assert after["id"]==pre["id"]
          assert updated[0]==c01,"C01 changed; that is not permitted"
          assert 0<=response["reusedClips"]<=6
          before_by_seq={c["sequence"]:c for c in old}
          for now in updated[1:]:
              previous=before_by_seq[now["sequence"]]
              original=originals[now["sequence"]]
              assert now["narration"]==previous["narration"],"Working script was modified"
              assert now["scriptRevision"]==previous["scriptRevision"],"Working revision was modified"
              if previous["generated"]:
                  assert now==previous,"Existing working voice was overwritten"
              elif now["generated"] and not previous["generated"]:
                  assert previous["lockedAt"] and bool(now["approvedAt"])==bool(original["approvedAt"]),"Unapproved voice was autoapproved"
                  assert now["narration"]==original["narration"],"Voice text mismatch"
              else:
                  assert now==previous,"Unmatched working draft was modified"
          originals_after={x["sequence"]:x for x in req("/api/v1/voice-clips?scriptRevision="+str(source_revision))
                           if x.get("shotKey")=="SHOT 05"}
          assert {n:{"narration":v["narration"],"generated":v["generated"],
                   "approved":v["approved"],"generationRevision":v["generationRevision"],
                   "approvedAt":v["approvedAt"]} for n,v in originals_after.items()}==source_before
          print("REUSE PASS: no original voice or video touched; existing C01 preserved.",flush=True)
          print("Previously generated source audio reused:",response["reusedClips"],flush=True)
          print("Working clips voice-approved:",sum(c["approvedAt"] is not None for c in updated),flush=True)
          print("Working clips still awaiting generation/Director review:",[c["clipKey"] for c in updated if c["approvedAt"] is None],flush=True)
          print("No ElevenLabs invocation and no Director approval created.",flush=True)
          PY
