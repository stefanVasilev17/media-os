name: SHOT07 v9 MP4 availability and media validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shot07-v9-video-delivery-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v9-render:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify exact v9 MP4 is accessible with HD picture and audio
        shell: bash
        run: |
          set -euo pipefail
          url="https://media-os-backend-production.up.railway.app/api/v1/remotion/renders/88aed1cd-0945-4969-b489-ac031c6c2766/video"
          curl -fSL --connect-timeout 15 --max-time 110 "$url" -o shot07-v9.mp4
          test "$(stat -c%s shot07-v9.mp4)" -gt 4000000
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 shot07-v9.mp4 | grep -q '^1920,1080$'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 shot07-v9.mp4 | grep -q '[a-z]'
          echo "DIRECTOR V9 MP4 DELIVERY VERIFIED"
