name: SHOT06 Publish Director v3 Clean Layout Verified MP4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shot06-publish-director-v3-clean-layout.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: shot06-director-v3-clean-layout-2026-10-21
    steps:
      - uses: actions/checkout@v4
      - name: Fetch already rendered v3 video without rebuilding it
        shell: bash
        run: |
          gh run download 39600725589 -R stefanVasilev17/media-os -n SHOT06-Director-v3-CleanLayout-MP4-and-QA -D .
          test -s out/SHOT06_LoadBalancer_Director_v3_CleanLayout.mp4
      - name: Install independent H264 and AAC validator
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Confirm original seven approved voices, output and frame integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          file="out/SHOT06_LoadBalancer_Director_v3_CleanLayout.mp4"
          props=json.load(open("shot06-director-v3-props.json"))
          assert props["durationInFrames"]==5137
          assert len(props["audioClips"])==7
          assert len(props["comprehensionHolds"])==6
          info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",file]))
          video=next(s for s in info["streams"] if s["codec_type"]=="video")
          audio=next(s for s in info["streams"] if s["codec_type"]=="audio")
          assert video["codec_name"]=="h264" and audio["codec_name"]=="aac"
          assert video["width"]==1280 and video["height"]==720 and video["r_frame_rate"]=="30/1"
          assert 171.0<float(info["format"]["duration"])<171.6
          assert os.stat(file).st_size==12326125
          for t in (8,21,28,38,45,61,73,82,90,103,113,120,127,137,143,150,159,169):
              image=subprocess.check_output(["ffmpeg","-nostdin","-v","error","-ss",str(t),"-i",file,
              "-frames:v","1","-vf","scale=640:360","-f","image2pipe","-vcodec","mjpeg","pipe:1"])
              assert image[:2]==bytes((255,216)),t
          print("SHOT06_V3_INDEPENDENT_QA_PASS",os.stat(file).st_size,flush=True)
          PY
      - name: Publish as a separate Director-only GitHub prerelease
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/SHOT06_LoadBalancer_Director_v3_CleanLayout.mp4 --clobber
          else
            gh release create "$TAG" out/SHOT06_LoadBalancer_Director_v3_CleanLayout.mp4 \
              --title "EP001 SHOT06 — Director Review v3 Clean Layout" \
              --notes "Actual full 2:51 Director review MP4, seven unchanged approved audio tracks. Corrected LOGIN REQUEST, ZONE B header spacing, Load Balancer and Auth instance cards. Not Director LOCKED. SHOT01–05 untouched." \
              --prerelease
          fi
          gh release view "$TAG" --json url,assets --jq '{url:.url,assets:[.assets[]|{name:.name,size:.size,url:.url}]}'
          echo 'DIRECTOR_V3_CLEAN_LAYOUT_PUBLISHED; SHOT06_NOT_LOCKED'
