name: Patch direct overlay readiness

on:
  push:
    paths:
      - '.github/patch_direct_overlay_readiness.py'
      - '.github/workflows/patch-direct-overlay-readiness.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply readiness patch
        run: python .github/patch_direct_overlay_readiness.py

      - name: Validate helper syntax
        run: node --check worker/spline-direct-overlay.js

      - name: Remove temporary patch files
        run: |
          rm .github/patch_direct_overlay_readiness.py
          rm .github/workflows/patch-direct-overlay-readiness.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/spline-direct-overlay.js .github
          git commit -m "Retry Spline editor readiness in direct overlay discovery"
          git push
