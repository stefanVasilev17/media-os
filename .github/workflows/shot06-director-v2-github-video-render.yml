name: SHOT06 Director v2 Full Voice-Synced MP4 Build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shot06-director-v2-github-video-render.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: shot06-director-v2-2026-10-21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare seven Director-approved voice tracks and Remotion word anchors
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,re,urllib.request,urllib.parse
          BASE="https://media-os-backend-production.up.railway.app"
          FPS=30
          def get(path):
              with urllib.request.urlopen(BASE+path,timeout=65) as r:
                  return json.load(r)
          visual=get("/api/v1/visual/state?scriptRevision=3")
          protected=[s for s in visual["shots"] if s["shotKey"] in ("SHOT 01","SHOT 02","SHOT 03","SHOT 04","SHOT 05")]
          assert len(protected)==5 and all(s["locked"] for s in protected)
          shot=next(s for s in visual["shots"] if s["shotKey"]=="SHOT 06")
          assert not shot["locked"],"Refusing a new visual preview of already LOCKED SHOT06"
          clips=sorted((c for c in get("/api/v1/voice-clips?scriptRevision=3") if c["shotKey"]=="SHOT 06"),key=lambda c:c["sequence"])
          assert len(clips)==7 and all(c["generated"] and c["approved"] for c in clips)
          assert [c["clipKey"] for c in clips]==["SHOT 06-C0"+str(i) for i in range(1,8)]
          assert "A zone is a separate part of the cloud infrastructure" in clips[5]["narration"]
          voice=next(s for s in get("/api/v1/voice/shots?scriptRevision=3") if s["shotKey"]=="SHOT 06")
          assert voice["voiceApproved"] and voice["visualSyncReady"]
          sourcewords=voice["alignment"]["words"]
          norm=lambda x:re.sub(r"[^a-z0-9]","",str(x).lower())
          spoken=[norm(w["text"]) for w in sourcewords]
          sec=0.0;frame=0;windows=[];tracks=[];holds=[]
          for i,c in enumerate(clips):
              duration=float(c["durationSeconds"])
              assert 0<duration<40 and math.isfinite(duration)
              length=math.ceil(duration*FPS)
              source=BASE+"/api/v1/voice-clips/"+urllib.parse.quote(c["clipKey"],safe="")+"/audio?scriptRevision=3&v="+str(c["generationRevision"])
              tracks.append({"src":source,"fromFrame":frame,"durationInFrames":length,
                             "trimBeforeFrames":round(float(c.get("leadingTrimSeconds") or 0)*FPS)})
              windows.append((sec,sec+duration,frame))
              sec+=duration;frame+=length
              if i<6:
                  holds.append({"fromFrame":frame,"toFrame":frame+60,"canonicalFrame":frame-1})
                  frame+=60
          frame+=90
          phrases={
            "THREE_COPIES":"There are three running copies of Auth Service",
            "SERVER_A":"A B and C",
            "SERVER_B":"B and C",
            "SERVER_C":"C",
            "BOTTLENECK":"Send everything to the same server",
            "DISTRIBUTION_RULES":"The Load Balancer uses configured traffic distribution rules",
            "ROUND_ROBIN":"Here's one possible rule Round Robin",
            "FIRST_A":"The first goes to Instance A",
            "SECOND_B":"The second goes to B",
            "THIRD_C":"And the third goes to C",
            "HASH_SAMPLES":"two example requests carrying the same stable key",
            "SAME_DESTINATION":"Same key Same destination",
            "PROBE_1":"The Load Balancer sends a health probe",
            "NO_RESPONSE":"No response",
            "PROBE_2":"Another probe times out",
            "THRESHOLD":"After the configured failure threshold is reached",
            "MARK_UNHEALTHY":"Instance C is marked unhealthy",
            "ROUTE_REMOVED":"Its route disappears from the eligible pool",
            "SELECT_B":"Under this system",
            "ZONE_EXPLAIN":"A zone is a separate part of the cloud infrastructure",
            "GREEN_MOVES":"And now our request finally moves",
            "AUTH_ARRIVAL":"Our request has reached Auth Service",
            "PASSWORD_NOT_CHECKED":"It never checked the password",
            "QUESTION":"Can that server actually trust the credentials"
          }
          anchors={}
          for key,text in phrases.items():
              tokens=[norm(t) for t in text.split()]
              positions=[i for i in range(len(spoken)-len(tokens)+1) if spoken[i:i+len(tokens)]==tokens]
              assert positions,(key,text)
              raw=float(sourcewords[positions[0]]["start"])
              window=next((w for j,w in enumerate(windows) if raw<=w[1]+.015 or j==6),None)
              assert window
              anchors[key]=window[2]/FPS+max(0,raw-window[0])
          assert anchors["THREE_COPIES"]<anchors["FIRST_A"]<anchors["HASH_SAMPLES"]<anchors["PROBE_1"]<anchors["SELECT_B"]<anchors["ZONE_EXPLAIN"]<anchors["GREEN_MOVES"]
          assert frame==5137,(frame,sec)
          props={"audioUrl":"","audioClips":tracks,"durationInFrames":frame,"anchors":anchors,"comprehensionHolds":holds}
          open("shot06-director-v2-props.json","w").write(json.dumps(props))
          print("VOICE_PREPARED",json.dumps({"frames":frame,"seconds":frame/FPS,"sourceClips":len(tracks),"holds":len(holds)}),flush=True)
          PY
      - name: Install Remotion and browser
        working-directory: remotion-engine
        run: |
          npm install --no-audit --no-fund
          npx remotion browser ensure
      - name: Runtime frame smoke test before full render
        working-directory: remotion-engine
        run: |
          mkdir -p ../out
          npx remotion still src/index.ts EP001-Shot06-VoiceSynced ../out/shot06-first-check.png --props=../shot06-director-v2-props.json --frame=2840 --scale=0.6666666666666666
      - name: Render full 171 second Director preview with exact original voice
        working-directory: remotion-engine
        timeout-minutes: 65
        run: |
          npx remotion render src/index.ts EP001-Shot06-VoiceSynced ../out/SHOT06_LoadBalancer_Director_v2.mp4 \
            --props=../shot06-director-v2-props.json --codec=h264 --audio-codec=aac \
            --scale=0.6666666666666666 --concurrency=2 --overwrite
      - name: Independently validate frame count, audio, duration and render samples
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess,os
          path="out/SHOT06_LoadBalancer_Director_v2.mp4"
          d=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_format","-show_streams","-of","json",path]))
          video=next(x for x in d["streams"] if x["codec_type"]=="video")
          audio=next(x for x in d["streams"] if x["codec_type"]=="audio")
          seconds=float(d["format"]["duration"])
          assert video["width"]==1280 and video["height"]==720,video
          assert video["r_frame_rate"]=="30/1",video
          assert 171.0<seconds<171.6,seconds
          assert audio["codec_type"]=="audio"
          assert os.path.getsize(path)>1_000_000
          for t in [8,38,61,90,110,127,143,159,170]:
              data=subprocess.check_output(["ffmpeg","-v","error","-ss",str(t),"-i",path,"-frames:v","1","-vf","scale=640:360","-f","image2pipe","-vcodec","mjpeg","pipe:1"])
              assert data[:2]==b"\xff\xd8"
          print("DIRECTOR_V2_VERIFIED",json.dumps({"seconds":seconds,"width":video["width"],"height":video["height"],
            "videoCodec":video["codec_name"],"audioCodec":audio["codec_name"],
            "bytes":os.path.getsize(path),"reviewStatus":"NOT_LOCKED"}),flush=True)
          PY
      - name: Publish Director-only prerelease video
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/SHOT06_LoadBalancer_Director_v2.mp4 --clobber
          else
            gh release create "$TAG" out/SHOT06_LoadBalancer_Director_v2.mp4 \
              --title "EP001 SHOT06 Load Balancer — Director Review v2" \
              --notes "Video review only. Seven approved original ElevenLabs clips. Animated native balancer traffic, Round Robin, clean frame layout and healthy-instance Auth handoff. NOT DIRECTOR LOCKED. SHOT01-05 unchanged." \
              --prerelease
          fi
          gh release view "$TAG" --json url,assets --jq '{url:.url,assets:[.assets[]|{name:.name,url:.url,size:.size}]}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SHOT06-Director-v2-Full-MP4-and-QA
          path: |
            out/SHOT06_LoadBalancer_Director_v2.mp4
            out/shot06-first-check.png
            shot06-director-v2-props.json
          if-no-files-found: warn
          retention-days: 30
