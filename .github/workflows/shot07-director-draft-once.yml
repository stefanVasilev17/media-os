name: SHOT07 Director v9 Visible Database Scan — guarded review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shot07-director-draft-once.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: ep001-shot07-director-one-shot-review
  cancel-in-progress: false

jobs:
  queue-director-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact v9 source
        uses: actions/checkout@v4
      - name: Ensure v9 renderer source and remove unsupported overlays
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AuthServiceTier2V9YoutubePreview' remotion-engine/src/episodes/ep001/live-diagram/VoiceSyncedShot.tsx
          grep -q 'v9-db-clip' remotion-engine/src/episodes/ep001/live-diagram/AuthServiceTier2V9YoutubePreview.tsx
          ! grep -q 'SEARCHING RECORD' remotion-engine/src/episodes/ep001/live-diagram/AuthServiceTier2V9YoutubePreview.tsx
          ! grep -q 'The original request stays. A different request moves.' remotion-engine/src/episodes/ep001/live-diagram/AuthServiceTier2V9YoutubePreview.tsx
          grep -q 'DIRECTOR_AUTH_DB_VISIBLE_SCAN_V9_REVIEW' ops/shot07/render_director_review_once.py
          grep -q 'a9cd36f8-5898-4132-bafc-45112d316248' ops/shot07/render_director_review_once.py
      - name: Wait for exact v9 worker deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            state="$(gh api repos/stefanVasilev17/media-os/commits/5ea3f7f4a57ef768886e07591c8b5c435f7018ee/status --jq '[.statuses[] | select(.context=="MediaOS - media-os-render-worker")][0].state // "pending"')"
            echo "v9 worker: $state"
            if [ "$state" = success ]; then exit 0; fi
            if [ "$state" = failure ] || [ "$state" = error ]; then exit 1; fi
            sleep 5
          done
          echo "v9 worker was not deployed. No stale render queued." >&2
          exit 1
      - name: Verify Director v6 visual contract, keep immutable voices
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://media-os-backend-production.up.railway.app/api/v1/director-visual-contract/shot-07 |
            python3 -c "import json,sys; d=json.load(sys.stdin); assert d['ready'] and d['payload']['source']=='DIRECTOR_AUTH_SCREEN_VISIBLE_V6_2026_10_24'"
      - name: Confirm fully active v9 worker
        shell: bash
        run: sleep 25
      - name: Queue clean v9 1080p voice-synced director-review video
        env:
          MEDIAOS_BASE: https://media-os-backend-production.up.railway.app
        run: python3 ops/shot07/render_director_review_once.py
