name: SHOT07 Director Draft Review — one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shot07-director-draft-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ep001-shot07-director-one-shot-review
  cancel-in-progress: false

jobs:
  queue-director-review:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact director-review producer
        uses: actions/checkout@v4
      - name: Verify five approved clips and queue isolated DRAFT render
        env:
          MEDIAOS_BASE: https://media-os-backend-production.up.railway.app
        run: python3 ops/shot07/render_director_review_once.py
