name: SHOT07 Tier++ Auth MiniPhone Director Review — one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shot07-director-draft-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ep001-shot07-director-one-shot-review
  cancel-in-progress: false

jobs:
  queue-director-review:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout exact director-review producer
        uses: actions/checkout@v4
      - name: Wait until exact Tier++ Director Visual Contract is live
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 12 \
                https://media-os-backend-production.up.railway.app/api/v1/director-visual-contract/shot-07 \
                | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['ready'] and d['payload']['source']=='DIRECTOR_TIER2_VISUAL_PASS_V3_2026_10_24'"; then
              echo "Tier++ visual contract verified"
              exit 0
            fi
            sleep 5
          done
          echo "Tier++ visual contract is not live; refusing legacy render" >&2
          exit 1
      - name: Verify five approved clips and queue isolated DRAFT render
        env:
          MEDIAOS_BASE: https://media-os-backend-production.up.railway.app
        run: python3 ops/shot07/render_director_review_once.py
