name: SHOT07 Director v10 iPhone Database Scan — guarded review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shot07-director-draft-once.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: ep001-shot07-director-one-shot-review
  cancel-in-progress: false

jobs:
  queue-director-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact v10 source
        uses: actions/checkout@v4
      - name: Ensure v10 renderer source and remove unsupported overlays
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AuthServiceTier2V10YoutubePreview' remotion-engine/src/episodes/ep001/live-diagram/VoiceSyncedShot.tsx
          grep -q 'v10-db-window' remotion-engine/src/episodes/ep001/live-diagram/AuthServiceTier2V10YoutubePreview.tsx
          grep -q 'v10-phone-screen-clip' remotion-engine/src/episodes/ep001/live-diagram/AuthServiceTier2V10YoutubePreview.tsx
          ! grep -q '>Continue<' remotion-engine/src/episodes/ep001/live-diagram/AuthServiceTier2V10YoutubePreview.tsx
          ! grep -q 'SEARCHING RECORD' remotion-engine/src/episodes/ep001/live-diagram/AuthServiceTier2V10YoutubePreview.tsx
          ! grep -q 'The original request stays. A different request moves.' remotion-engine/src/episodes/ep001/live-diagram/AuthServiceTier2V10YoutubePreview.tsx
          grep -q 'DIRECTOR_IPHONE_DB_SCAN_V10_REVIEW' ops/shot07/render_director_review_once.py
          grep -q '88aed1cd-0945-4969-b489-ac031c6c2766' ops/shot07/render_director_review_once.py
      - name: Wait for exact v10 worker deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            state="$(gh api repos/stefanVasilev17/media-os/commits/4dc626adf0c0de9eebacd34ac0f6eb30cd06ce0a/status --jq '[.statuses[] | select(.context=="MediaOS - media-os-render-worker")][0].state // "pending"')"
            echo "v10 worker: $state"
            if [ "$state" = success ]; then exit 0; fi
            if [ "$state" = failure ] || [ "$state" = error ]; then exit 1; fi
            sleep 5
          done
          echo "v10 worker was not deployed. No stale render queued." >&2
          exit 1
      - name: Verify Director v6 visual contract, keep immutable voices
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://media-os-backend-production.up.railway.app/api/v1/director-visual-contract/shot-07 |
            python3 -c "import json,sys; d=json.load(sys.stdin); assert d['ready'] and d['payload']['source']=='DIRECTOR_AUTH_SCREEN_VISIBLE_V6_2026_10_24'"
      - name: Allow previous worker to exit before fresh v10 render
        shell: bash
        run: sleep 50
      - name: Queue clean v10 1080p voice-synced director-review video
        env:
          MEDIAOS_BASE: https://media-os-backend-production.up.railway.app
        run: python3 ops/shot07/render_director_review_once.py
