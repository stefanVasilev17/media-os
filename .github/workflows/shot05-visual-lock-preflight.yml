name: SHOT05 Director visual lock audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the canonical LOCKED SHOT05 master without changing data
        run: |
          python3 - <<'PY'
          import json,urllib.request
          base="https://media-os-backend-production.up.railway.app"
          with urllib.request.urlopen(base+"/api/v1/visual/state?scriptRevision=3",timeout=45) as r:
              state=json.load(r)
          shot=next(s for s in state["shots"] if s["shotKey"]=="SHOT 05")
          expected="978127c4-fed2-40a8-ad5d-e7e3920b71cb"
          assert shot["locked"] and shot["lockedRenderId"]==expected,shot.get("lockedRenderId")
          assert shot["voiceReady"] and shot["qaStatus"]=="PASS"
          print("SHOT05 LOCK VERIFIED",expected,flush=True)
          PY
