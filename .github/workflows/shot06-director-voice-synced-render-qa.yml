name: SHOT06 Clean Load Balancer Voice-Synced Director Render
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shot06-director-voice-synced-render-qa.yml'
permissions:
  contents: read
jobs:
  review-render:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Render SHOT06 approved voice with semantic anchors and six director reading pauses
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,re,time,urllib.request,urllib.error,uuid
          from urllib.parse import quote
          BASE="https://media-os-backend-production.up.railway.app"
          FPS=30
          PAUSE_FRAMES=60
          END_HOLD_FRAMES=90
          SHOT="SHOT 06"
          def get(path):
              request=urllib.request.Request(BASE+path,headers={"Accept":"application/json"})
              with urllib.request.urlopen(request,timeout=65) as response:
                  assert response.status==200
                  return json.load(response)
          def post(path,body):
              payload=json.dumps(body).encode("utf-8")
              request=urllib.request.Request(BASE+path,data=payload,method="POST",
                  headers={"Accept":"application/json","Content-Type":"application/json"})
              with urllib.request.urlopen(request,timeout=65) as response:
                  assert response.status in (200,202)
                  return json.load(response)
          before=get("/api/v1/visual/state?scriptRevision=3")
          state=next(s for s in before["shots"] if s["shotKey"]==SHOT)
          assert not state.get("locked"),"Director-LOCKED SHOT06: do not rerender."
          protected={s["shotKey"]:(s["locked"],s.get("lockedRenderId"),s.get("renderId"))
               for s in before["shots"] if s["shotKey"] in
               ("SHOT 01","SHOT 02","SHOT 03","SHOT 04","SHOT 05")}
          assert len(protected)==5 and all(x[0] for x in protected.values())
          all_clips=get("/api/v1/voice-clips?scriptRevision=3")
          clips=sorted([x for x in all_clips if x["shotKey"]==SHOT],key=lambda x:x["sequence"])
          assert len(clips)==7 and all(c["generated"] and c["approved"] for c in clips)
          assert [c["sequence"] for c in clips]==list(range(1,8))
          assert "A zone is a separate part of the cloud infrastructure" in clips[5]["narration"]
          approved=[(c["clipKey"],c["narration"],c["generationRevision"],c["approved"]) for c in clips]
          protected_voice={c["clipKey"]:(c["narration"],c["generationRevision"],c["approved"])
              for c in all_clips if c["shotKey"] in protected}
          voice_shots=get("/api/v1/voice/shots?scriptRevision=3")
          voice=next(x for x in voice_shots if x["shotKey"]==SHOT)
          assert voice["voiceApproved"] and voice["visualSyncReady"]
          words=voice["alignment"]["words"]
          assert len(words)>250
          cursor=0
          raw_cursor=0.0
          windows=[]
          tracks=[]
          holds=[]
          for i,c in enumerate(clips):
              sec=float(c["durationSeconds"])
              assert 0<sec<40 and math.isfinite(sec)
              frames=math.ceil(sec*FPS)
              trim=round(float(c.get("leadingTrimSeconds") or 0)*FPS)
              source=(BASE+"/api/v1/voice-clips/"+quote(c["clipKey"],safe="")+
                      "/audio?scriptRevision=3&v="+str(c["generationRevision"]))
              tracks.append({"src":source,"fromFrame":cursor,
                  "durationInFrames":frames,"trimBeforeFrames":trim})
              windows.append({"rawStart":raw_cursor,"rawEnd":raw_cursor+sec,
                  "screenStartFrame":cursor,"seconds":sec,"index":i})
              raw_cursor+=sec
              cursor+=frames
              if i<6:
                  holds.append({"fromFrame":cursor,"toFrame":cursor+PAUSE_FRAMES,
                                "canonicalFrame":cursor-1})
                  cursor+=PAUSE_FRAMES
          voice_end=cursor
          cursor+=END_HOLD_FRAMES
          assert len(tracks)==7 and len(holds)==6
          assert all(h["toFrame"]-h["fromFrame"]==PAUSE_FRAMES for h in holds)
          def normalize(word):
              return re.sub(r"[^a-z0-9]","",str(word).lower())
          tokenized=[normalize(w["text"]) for w in words]
          phrases={
            "THREE_COPIES":"There are three running copies of Auth Service",
            "BOTTLENECK":"Send everything to the same server",
            "DISTRIBUTION_RULES":"The Load Balancer uses configured traffic distribution rules",
            "ROUND_ROBIN":"Here's one possible rule Round Robin",
            "FIRST_A":"The first goes to Instance A",
            "SECOND_B":"The second goes to B",
            "THIRD_C":"And the third goes to C",
            "HASH_SAMPLES":"two example requests carrying the same stable key",
            "SAME_DESTINATION":"Same key Same destination",
            "PROBE_1":"The Load Balancer sends a health probe",
            "NO_RESPONSE":"No response",
            "PROBE_2":"Another probe times out",
            "THRESHOLD":"After the configured failure threshold is reached",
            "MARK_UNHEALTHY":"Instance C is marked unhealthy",
            "ROUTE_REMOVED":"Its route disappears from the eligible pool",
            "SELECT_B":"Under this system",
            "ZONE_EXPLAIN":"A zone is a separate part of the cloud infrastructure",
            "GREEN_MOVES":"And now our request finally moves",
            "AUTH_ARRIVAL":"Our request has reached Auth Service",
            "PASSWORD_NOT_CHECKED":"It never checked the password",
            "QUESTION":"Can that server actually trust the credentials",
          }
          anchors={}
          for key,phrase in phrases.items():
              tokens=[normalize(t) for t in phrase.split()]
              matches=[i for i in range(len(tokenized)-len(tokens)+1)
                  if tokenized[i:i+len(tokens)]==tokens]
              assert matches,("Missing voice alignment phrase:",key,phrase)
              raw=float(words[matches[0]]["start"])
              match=next((w for j,w in enumerate(windows)
                  if raw<=w["rawEnd"]+.015 or j==6),None)
              assert match is not None
              screen_sec=match["screenStartFrame"]/FPS+max(0,raw-match["rawStart"])
              anchors[key]=screen_sec
          assert anchors["THREE_COPIES"]<anchors["FIRST_A"]<anchors["HASH_SAMPLES"]<anchors["PROBE_1"]<anchors["SELECT_B"]<anchors["ZONE_EXPLAIN"]<anchors["GREEN_MOVES"]
          props={
            "shotKey":SHOT,"scriptRevision":3,
            "generationRevision":voice["generationRevision"],
            "directorRerenderId":str(uuid.uuid4()),
            "audioUrl":"","audioClips":tracks,"durationInFrames":cursor,
            "anchors":anchors,"comprehensionHolds":holds
          }
          print("SHOT06 VOICE QA: APPROVED 7 CLIPS, ORIGINAL AUDIO UNCHANGED",flush=True)
          print("TIMING",json.dumps({"frames":cursor,"duration":round(cursor/FPS,3),
            "clips":[(c["clipKey"],c["durationSeconds"],tracks[i]["fromFrame"])
                for i,c in enumerate(clips)],"anchors":anchors}),flush=True)
          render=post("/api/v1/remotion/renders/compositions/EP001-Shot06-VoiceSynced",
                      {"profile":"FAST_PREVIEW","inputProps":props})
          assert render["compositionId"]=="EP001-Shot06-VoiceSynced",render
          rid=render["renderId"]
          print("SHOT06_RENDER_ID",rid,"INITIAL",render["status"],flush=True)
          for attempt in range(320):
              result=get("/api/v1/remotion/renders/"+rid)
              if attempt%6==0:print("PROGRESS",result["status"],result.get("progress"),flush=True)
              if result["status"]=="READY":break
              if result["status"]=="FAILED":raise RuntimeError("Remotion failed: "+str(result.get("error")))
              time.sleep(10)
          else:raise TimeoutError("Shot06 render did not finish in time")
          assert result["durationInFrames"]==cursor and result["fps"]==FPS,result
          assert result["width"]==1280 and result["height"]==720,result
          request=urllib.request.Request(BASE+"/api/v1/remotion/renders/"+rid+"/video",
              headers={"Range":"bytes=0-63"})
          with urllib.request.urlopen(request,timeout=65) as response:
              assert response.status in (200,206)
              assert b"ftyp" in response.read(64),"No valid MP4 header"
          fresh=get("/api/v1/voice-clips?scriptRevision=3")
          ref=sorted([x for x in fresh if x["shotKey"]==SHOT],key=lambda x:x["sequence"])
          assert [(c["clipKey"],c["narration"],c["generationRevision"],c["approved"])
                  for c in ref]==approved,"Approved voice changed!"
          assert {c["clipKey"]:(c["narration"],c["generationRevision"],c["approved"])
              for c in fresh if c["shotKey"] in protected}==protected_voice
          final=get("/api/v1/visual/state?scriptRevision=3")
          final_protected={s["shotKey"]:(s["locked"],s.get("lockedRenderId"),s.get("renderId"))
              for s in final["shots"] if s["shotKey"] in protected}
          assert final_protected==protected,"Protected shot locks changed!"
          current=next(x for x in final["shots"] if x["shotKey"]==SHOT)
          assert not current.get("locked"),"SHOT 06 unexpectedly LOCKED without Director"
          print("SHOT06 DIRECTOR PREVIEW MP4 READY",rid,
            "FRAMES",cursor,"SECONDS",round(cursor/FPS,3),
            "BYTES",result.get("sizeBytes"),flush=True)
          print("VIDEO_URL",BASE+"/api/v1/remotion/renders/"+rid+"/video",flush=True)
          print("SAFE: SHOT01-05 remain LOCKED. All seven approved voice recordings untouched. No SHOT06 Director LOCK.",flush=True)
          PY
