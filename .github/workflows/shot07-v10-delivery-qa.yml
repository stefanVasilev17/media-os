name: SHOT07 v10 Director MP4 delivery QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shot07-v10-delivery-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v10-video:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check endpoint, duration, 1080p and approved-audio output
        shell: bash
        run: |
          set -euo pipefail
          url="https://media-os-backend-production.up.railway.app/api/v1/remotion/renders/dc31f24e-ea31-462a-8398-457f780e7f6a/video"
          curl -fSL --retry 2 --connect-timeout 15 --max-time 110 "$url" -o shot07-v10.mp4
          test "$(stat -c%s shot07-v10.mp4)" -gt 4000000
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 shot07-v10.mp4 | grep -q '^1920,1080$'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 shot07-v10.mp4 | grep -q '[a-z]'
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 shot07-v10.mp4
          echo "V10 MP4 VERIFIED"
