name: Patch authoring address model

on:
  push:
    paths:
      - '.github/workflows/patch-authoring-address-model.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply patch
        run: python scripts/patch_authoring_address_model.py
      - name: Compile backend
        working-directory: backend
        run: mvn -q -DskipTests compile
      - name: Validate worker syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'worker/spline-worker.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Remove temporary patch files
        run: |
          rm scripts/patch_authoring_address_model.py
          rm .github/workflows/patch-authoring-address-model.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/main/java/com/architecturalthinking/mediaos/spline/SplineSceneSlotRegistryService.java backend/src/main/java/com/architecturalthinking/mediaos/spline/SplineAuthoringOverlayRegistryService.java worker/spline-worker.ps1 scripts/patch_authoring_address_model.py .github/workflows/patch-authoring-address-model.yml
          git commit -m 'Separate runtime visual slots from authoring discovery'
          git push origin main
