name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test

  windows-worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell worker syntax
        shell: powershell
        run: |
          $scripts = @(
            "$env:GITHUB_WORKSPACE\worker\spline-worker.ps1",
            "$env:GITHUB_WORKSPACE\worker\media-os-local-runner.ps1",
            "$env:GITHUB_WORKSPACE\worker\install-local-runner.ps1"
          )

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script: $($_.Message)" }
              exit 1
            }

            Write-Host "$script syntax OK"
          }
      - name: Smoke-test PowerShell Codex shim launcher
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\worker\spline-worker.ps1" -LauncherSelfTest
