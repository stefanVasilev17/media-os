name: CI
on:
  pull_request:
  push:
    branches: [main, gpu-dev]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test

  remotion-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  remotion-preview:
    runs-on: ubuntu-latest
    needs: remotion-engine
    defaults:
      run:
        working-directory: remotion-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Render EP001 native YouTube widescreen preview
        run: >-
          npx remotion render EP001-PhoneFirst-Youtube out/ep001-phone-first-youtube.mp4
          --codec=h264
          --crf=20
          --x264-preset=veryfast
          --concurrency=50%
          --props='{"showGuides":false}'
      - uses: actions/upload-artifact@v4
        with:
          name: ep001-phone-first-youtube
          path: remotion-engine/out/ep001-phone-first-youtube.mp4
          if-no-files-found: error
          retention-days: 7

  remotion-validation-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: remotion-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Write Remotion props file
        shell: powershell
        run: Set-Content -Path props.json -Value '{"showGuides":false}' -Encoding ascii
      - name: Render EP001 Shot 02 Request Assembly preview
        shell: powershell
        run: npx remotion render EP001-RequestAssembly-Youtube out/ep001-request-assembly-youtube-windows.mp4 --codec=h264 --crf=20 --x264-preset=veryfast --concurrency=50% --props=props.json
      - uses: actions/upload-artifact@v4
        with:
          name: ep001-request-assembly-youtube-windows
          path: remotion-engine/out/ep001-request-assembly-youtube-windows.mp4
          if-no-files-found: error
          retention-days: 7

  gpu-worker-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production GPU worker image
        run: docker build -f gpu-render-worker/Dockerfile -t media-os-gpu-worker:preflight .
      - name: Validate Remotion renderer entrypoint syntax
        run: docker run --rm --entrypoint node media-os-gpu-worker:preflight --check /app/render-remotion.mjs
      - name: Run container preflight suite
        run: docker run --rm --entrypoint /bin/bash media-os-gpu-worker:preflight -lc /app/ci-preflight.sh

  windows-worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell worker syntax
        shell: powershell
        run: |
          $scripts = @(
            "$env:GITHUB_WORKSPACE\worker\spline-worker.ps1",
            "$env:GITHUB_WORKSPACE\worker\spline-shot-worker.ps1",
            "$env:GITHUB_WORKSPACE\worker\media-os-local-runner.ps1",
            "$env:GITHUB_WORKSPACE\worker\install-local-runner.ps1"
          )

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              exit 1
            }

            Write-Host "$script syntax OK"
          }
      - name: Smoke-test PowerShell Codex shim launcher
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\worker\spline-worker.ps1" -LauncherSelfTest
          powershell -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\worker\spline-shot-worker.ps1" -LauncherSelfTest
