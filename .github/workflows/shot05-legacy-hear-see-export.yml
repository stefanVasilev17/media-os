name: Export SHOT05 legacy HEAR SEE import
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shot05-legacy-hear-see-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Export existing-technology import from current locked Script without mutations
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,urllib.request,zlib
          base="https://media-os-backend-production.up.railway.app"
          with urllib.request.urlopen(base+"/api/v1/production-contract/template",timeout=35) as response:
              template=json.load(response)
          with open("ops/shot05-v3/import/02_hear_see_contract.json",encoding="utf-8") as f:
              legacy=json.load(f)
          shots=[x for x in template["timeline"] if x["shotKey"]=="SHOT 05"]
          visuals=legacy["timeline"]
          assert template["schemaVersion"]=="mediaos.production-contract.v1"
          assert len(shots)==len(visuals)==7
          assert [(x["clipKey"],x["startSecond"],x["endSecond"]) for x in shots]==[
            (x["clipKey"],x["startSecond"],x["endSecond"]) for x in visuals]
          out={
            "schemaVersion":template["schemaVersion"],
            "episodeNumber":template["episodeNumber"],
            "title":template["title"],
            "scriptRevision":template["scriptRevision"],
            "source":"CHATGPT_LEGACY_SHOT05_HEAR_SEE_VISUAL_PRODUCTION_2026_10_17",
            "timeline":[],
          }
          for i,(actual,old) in enumerate(zip(shots,visuals)):
              row=dict(actual)
              row["segmentId"]="SHOT05-LEGACY-%02d"%(i+1)
              row["visual"]=old["visual"]
              if i==0:
                  visual=dict(row["visual"])
                  visual["summary"]="Maintain the exact SHOT 04 final frame and follow the real green login packet to API Gateway. At the spoken API Gateway words, focus the ACTUAL API Gateway node only, never the neighboring Load Balancer. The diagnostic panel remains hidden until C02. No replacement map or glows between nodes."
                  visual["attentionCue"]="Activate the existing API Gateway card when the approved narration names the API Gateway. The active border must align with the actual gateway geometry, never with the Load Balancer."
                  visual["notes"]="Director's C01 visual directions based on the currently LOCKED effective script. Do not use an old v2/v3 narration text as a replacement. Hold continuity with SHOT04 and retain the original approved Studio voice."
                  row["visual"]=visual
              if i==6:
                  visual=dict(row["visual"])
                  visual["attentionCue"]="Green canonical request passes API Gateway and travels along the REAL existing connector to Load Balancer. ONLY Load Balancer becomes active at the spoken handoff; Gateway gently dims. Do not animate a misplaced outline between both."
                  row["visual"]=visual
              out["timeline"].append(row)
          assert out["timeline"][0]["hear"]==shots[0]["hear"]
          assert all(row["hear"] and row["voiceDirection"] and row["visual"]["summary"]
                     for row in out["timeline"])
          assert all(row["startSecond"]<row["endSecond"] for row in out["timeline"])
          assert all(out["timeline"][i]["endSecond"]==out["timeline"][i+1]["startSecond"]
                     for i in range(6))
          raw=json.dumps(out,ensure_ascii=False,indent=2).encode("utf-8")
          with open("EP001_SHOT05_LEGACY_HEAR_SEE_IMPORT.json","wb") as f:
              f.write(raw)
          print("EXPORT_SCHEMA",out["schemaVersion"],flush=True)
          print("EXPORT_REVISION",out["scriptRevision"],flush=True)
          print("EXPORT_BLOCKS",len(out["timeline"]),flush=True)
          print("EXPORT_FIRST_HEAR",out["timeline"][0]["hear"],flush=True)
          print("EXPORT_SHA256",hashlib.sha256(raw).hexdigest(),flush=True)
          print("EXPORT_COMPRESSED_START",flush=True)
          print(base64.b64encode(zlib.compress(raw,9)).decode("ascii"),flush=True)
          print("EXPORT_COMPRESSED_END",flush=True)
          print("Only GET requests to MediaOS. Script, Voice, Visual and rendered video unchanged.",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EP001_SHOT05_LEGACY_HEAR_SEE_IMPORT
          path: EP001_SHOT05_LEGACY_HEAR_SEE_IMPORT.json
          retention-days: 14
