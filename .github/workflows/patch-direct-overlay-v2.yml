name: Patch direct overlay v2

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-direct-overlay-v2.py'
      - '.github/workflows/patch-direct-overlay-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply targeted patch
        run: python .github/patch-direct-overlay-v2.py

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          foreach ($path in @('worker/spline-worker.ps1', 'worker/media-os-local-runner.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path :: $($_.Message)" }
              exit 1
            }
          }

      - name: Validate direct helper syntax
        run: node --check worker/spline-direct-overlay.js

      - name: Compile backend
        run: mvn -q -f backend/pom.xml -DskipTests package

      - name: Remove temporary patch files
        run: |
          git rm .github/patch-direct-overlay-v2.py
          git rm .github/workflows/patch-direct-overlay-v2.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/java/com/architecturalthinking/mediaos/spline/SplineAuthoringOverlayRegistryService.java
          git add worker/media-os-local-runner.ps1 worker/spline-worker.ps1
          git commit -m "Use direct Spline MCP for overlay discovery"
          git push origin HEAD:main
