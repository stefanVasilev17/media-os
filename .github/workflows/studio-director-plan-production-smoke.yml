name: SHOT05 Director Visual Plan production verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-director-plan-production-smoke.yml'
permissions:
  contents: read
jobs:
  verify-approved-voice-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compile exact SHOT 05 C01-C07 Director JSON plan without rendering or regenerating audio
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          BASE="https://media-os-backend-production.up.railway.app"
          def call(path,data=None):
              encoded=None if data is None else json.dumps(data).encode()
              request=urllib.request.Request(BASE+path,data=encoded,
                  method="GET" if encoded is None else "POST",
                  headers={"Accept":"application/json","Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(request,timeout=35) as response:
                      assert response.status==200
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  print("Backend failed:",path,exc.code,exc.read().decode()[:1500],flush=True)
                  raise
          health=call("/actuator/health")
          assert health["status"]=="UP"
          provider=call("/api/v1/remotion/renders/provider-status")
          assert "EP001-Studio-DirectorPlan" in provider["compositions"],"New Director Remotion recipe was not registered"
          assert "EP001-Shot05-VoiceSynced" in provider["compositions"],"Original Director Remotion component missing"
          shots=call("/api/v1/studio/shots")
          originals=[s for s in shots if s.get("sourceShotKey")=="SHOT 05" and s.get("shotNumber")==5]
          assert len(originals)==1,"Need exactly one previously unlocked SHOT05 working copy"
          shot=originals[0]
          clips=sorted(shot["clips"],key=lambda x:x["sequence"])
          assert len(clips)==7,"SHOT05 must have 7 separate clips"
          assert all(c["approvedAt"] and c["generated"] for c in clips),"Director must approve all 7 studio voices"
          snapshot=[(c["id"],c["narration"],c["scriptRevision"],c["generationRevision"],c["approvedAt"]) for c in clips]
          old=call("/api/v1/voice-clips?scriptRevision="+str(shot["sourceScriptRevision"]))
          originals_before=[(c["clipKey"],c["narration"],c["approved"],c["generationRevision"]) for c in old if c.get("shotKey")=="SHOT 05"]
          assert len(originals_before)==7
          result=call("/api/v1/studio/shots/"+shot["id"]+"/generate-visual-plan",{})
          plan=result["plan"]
          assert result["ready"] is True and result["validation"]=="PASSED"
          assert plan["recipeId"]=="EP001_GATEWAY_DIAGNOSTICS_V1"
          assert plan["durationInFrames"]>=3900 and plan["durationInFrames"]<=5400
          assert len(plan["sections"])==len(plan["events"])==len(plan["audioSources"])==7
          assert [e["kind"] for e in plan["events"]]==[
            "GATEWAY_ARRIVAL","ROUTE_404","METHOD_405","RATE_LIMIT_429",
            "WAF_403","SCHEMA_400","LOAD_BALANCER_HANDOFF"]
          assert all(e["derivedFromVoiceAlignment"] for e in plan["events"])
          assert all(plan["sections"][i]["startFrame"]<=event["frame"]<plan["sections"][i]["endFrame"]
                     for i,event in enumerate(plan["events"]))
          print("Director plan PRODUCTION VALIDATED:",len(plan["events"]),"real voice-triggered moments.",flush=True)
          for e in plan["events"]:
              print(e["clipKey"],e["kind"],f'{e["frame"]/30:.2f}s',
                    "spoken:",e["spokenTrigger"],flush=True)
          saved=call("/api/v1/studio/shots/"+shot["id"]+"/visual-plan")
          assert saved["ready"] is True and saved["plan"]["voiceSignature"]==plan["voiceSignature"]
          after=call("/api/v1/studio/shots")
          working=[s for s in after if s.get("id")==shot["id"]][0]
          after_clips=sorted(working["clips"],key=lambda x:x["sequence"])
          assert [(c["id"],c["narration"],c["scriptRevision"],c["generationRevision"],c["approvedAt"])
                  for c in after_clips]==snapshot,"Working voices were changed!"
          fresh=call("/api/v1/voice-clips?scriptRevision="+str(shot["sourceScriptRevision"]))
          assert [(c["clipKey"],c["narration"],c["approved"],c["generationRevision"])
                   for c in fresh if c.get("shotKey")=="SHOT 05"]==originals_before
          print("SAFE: all original voice records, working voices and video locks unchanged.",flush=True)
          print("No new TTS, no render job, no automatic Director approval.",flush=True)
          PY
