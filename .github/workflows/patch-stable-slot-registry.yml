name: Patch stable slot registry

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-stable-slot-registry.py'
      - '.github/workflows/patch-stable-slot-registry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply stable slot patch
        run: python .github/patch-stable-slot-registry.py

      - name: Compile backend
        run: mvn -q -f backend/pom.xml -DskipTests package

      - name: Remove temporary patch files
        run: |
          git rm .github/patch-stable-slot-registry.py
          git rm .github/workflows/patch-stable-slot-registry.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/java/com/architecturalthinking/mediaos/spline/SplineSceneSlotRegistryService.java
          git commit -m "Preserve Spline slot IDs across rebuilds"
          git push origin HEAD:main
