name: Patch authoring overlay discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-authoring-overlay.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch worker prompt
        shell: python
        run: |
          from pathlib import Path

          path = Path("worker/spline-worker.ps1")
          text = path.read_text(encoding="utf-8")
          old = "- Load the Spline 3D skill at most once, and only if needed to use the exact read-only tool schema."
          new = "\n".join([
              "- FIRST call Spline/3d_load_skill exactly once.",
              "- Read the exact current schema for Spline/3d_get_objects from the loaded skill.",
              "- Then call Spline/3d_get_objects using only arguments documented by that skill.",
              "- Do not guess argument names or shapes."
          ])

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one authoring-overlay skill directive, found {count}.")

          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Remove temporary workflow
        run: git rm .github/workflows/patch-authoring-overlay.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/spline-worker.ps1
          git commit -m "Require Spline skill before overlay discovery"
          git push origin HEAD:main
