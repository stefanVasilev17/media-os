name: MediaOS EP002 Integrated Release Candidate

on:
  push:
    branches:
      - 'feat/mediaos-ep002-unified-product-integration'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'remotion-engine/**'
      - '.github/workflows/mediaos-ep002-release-candidate-ci.yml'
  workflow_dispatch:

concurrency:
  group: mediaos-ep002-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Java21 and isolated Postgres18
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: media_os
          POSTGRES_PASSWORD: media_os
          POSTGRES_DB: media_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U media_os -d media_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      CI_POSTGRES_URL: jdbc:postgresql://localhost:5432/media_os
      MEDIA_OS_REMOTION_CLAIMS_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Check canonical asset catalog
        run: python3 scripts/check_asset_catalog.py
      - name: Check production memory ID uniqueness
        run: python3 scripts/check_memory_ids.py
      - name: Compile, run tests and validate isolated DB migrations
        run: mvn --batch-mode --no-transfer-progress clean verify

  frontend:
    name: React TypeScript and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build release candidate
        run: npm run build
      - name: Test Director interface and routes
        run: npm test

  remotion:
    name: Remotion typecheck, Factory bundle and non-render tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: remotion-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check locked and generated scene sources
        run: npm run typecheck
      - name: Run Worker authorization and scene registry tests
        run: node --test *.test.mjs
      - name: Build Factory registry bundle without CPU rendering
        run: npm run build:factory
