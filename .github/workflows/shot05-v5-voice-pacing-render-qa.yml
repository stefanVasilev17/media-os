name: SHOT05 Director review - clear Gateway establishing frame
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shot05-v5-voice-pacing-render-qa.yml']
permissions:
  contents: read
jobs:
  review-render:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Render SHOT05 with simplified Network Transit to Gateway arrival
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,time,urllib.request,urllib.error,uuid
          from urllib.parse import quote
          BASE="https://media-os-backend-production.up.railway.app"
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(BASE+path,headers={"Accept":"application/json"}),timeout=50) as r:
                  assert r.status==200
                  return json.load(r)
          def post(path,body):
              payload=json.dumps(body).encode()
              with urllib.request.urlopen(urllib.request.Request(BASE+path,data=payload,method="POST",
                   headers={"Accept":"application/json","Content-Type":"application/json"}),timeout=50) as r:
                  assert r.status in (200,202)
                  return json.load(r)
          rev=3
          source=get("/api/v1/voice-clips?scriptRevision="+str(rev))
          clips=sorted((x for x in source if x.get("shotKey")=="SHOT 05"),key=lambda x:x["sequence"])
          assert len(clips)==7 and all(x["generated"] and x["approved"] for x in clips)
          assert [x["sequence"] for x in clips]==list(range(1,8))
          voices=get("/api/v1/voice/shots?scriptRevision="+str(rev))
          shot=next(x for x in voices if x["shotKey"]=="SHOT 05")
          assert shot["voiceApproved"] and shot["visualSyncReady"]
          raw=shot["alignment"]["anchors"]
          assert len(raw)>=7
          FPS=30
          C07_NATURAL_SPLIT_FRAMES=116
          C07_DIRECTOR_PAUSE_FRAMES=66
          FINAL_HOLD_FRAMES=105
          cursor=0
          raw_cursor=0.0
          clips_out=[]
          windows=[]
          holds=[]
          for i,clip in enumerate(clips):
              duration=float(clip["durationSeconds"])
              assert math.isfinite(duration) and duration>0 and duration<40
              audio_frames=max(1,math.ceil(duration*FPS))
              f=cursor
              original_src=(BASE+"/api/v1/voice-clips/"+quote(clip["clipKey"],safe="")+
                "/audio?scriptRevision="+str(rev)+"&v="+str(clip["generationRevision"]))
              trim=max(0,round(float(clip.get("leadingTrimSeconds") or 0)*FPS))
              if i==6:
                  split=C07_NATURAL_SPLIT_FRAMES
                  assert 30<split<audio_frames-45,"The measured C07 natural pause is outside the audio"
                  clips_out.append({"src":original_src,"fromFrame":f,
                                    "durationInFrames":split,"trimBeforeFrames":trim})
                  clips_out.append({"src":original_src,"fromFrame":f+split+C07_DIRECTOR_PAUSE_FRAMES,
                                    "durationInFrames":audio_frames-split,
                                    "trimBeforeFrames":trim+split})
                  cursor+=audio_frames+C07_DIRECTOR_PAUSE_FRAMES
              else:
                  clips_out.append({"src":original_src,"fromFrame":f,
                                    "durationInFrames":audio_frames,"trimBeforeFrames":trim})
                  cursor+=audio_frames
              windows.append((raw_cursor,raw_cursor+duration,f/FPS,duration))
              raw_cursor+=duration
              if i<6:
                  holds.append({"fromFrame":cursor,"toFrame":cursor+60,
                                "canonicalFrame":cursor-1})
                  cursor+=60
          original_approved_voice_end=cursor
          cursor+=FINAL_HOLD_FRAMES
          assert len(clips_out)==8 and clips_out[-2]["src"]==clips_out[-1]["src"]
          assert clips_out[-1]["fromFrame"]==(clips_out[-2]["fromFrame"]+
                 clips_out[-2]["durationInFrames"]+C07_DIRECTOR_PAUSE_FRAMES)
          assert len(holds)==6 and all(h["toFrame"]-h["fromFrame"]==60 for h in holds)
          anchors={}
          for k,v in raw.items():
              v=float(v)
              if not math.isfinite(v):continue
              for i,(beg,end,planned,duration) in enumerate(windows):
                  if v<=end+.02 or i==len(windows)-1:
                      anchors[k]=planned+max(0,min(duration,v-beg))
                      break
          assert len(anchors)>=7
          assert cursor>3300 and cursor<5400
          assert clips_out[-1]["fromFrame"]+clips_out[-1]["durationInFrames"]==original_approved_voice_end
          assert clips_out[3]["fromFrame"]-(
             clips_out[2]["fromFrame"]+clips_out[2]["durationInFrames"])==60
          print("PACING PASS: 7 original approved voice recordings, one C07 split at measured 3.86-second natural gap,",
                "66-frame director silence, 6 exact 60-frame reading holds,",
                "105-frame end hold,",cursor,"frames",round(cursor/30,3),"seconds",flush=True)
          print("Original approved C01 generation:",clips[0]["generationRevision"],flush=True)
          props={"shotKey":"SHOT 05","scriptRevision":rev,
                 "generationRevision":shot["generationRevision"],
                 "directorRerenderId":str(uuid.uuid4()),"audioUrl":"",
                 "audioClips":clips_out,"durationInFrames":cursor,"anchors":anchors,
                 "comprehensionHolds":holds}
          result=post("/api/v1/remotion/renders/compositions/EP001-Shot05-VoiceSynced",
                      {"profile":"FAST_PREVIEW","inputProps":props})
          assert result.get("compositionId")=="EP001-Shot05-VoiceSynced",result
          rid=result["renderId"]
          print("RENDER_ID",rid,"status",result["status"],flush=True)
          for attempt in range(120):
              state=get("/api/v1/remotion/renders/"+rid)
              if attempt%6==0:
                  print("RENDER_PROGRESS",state["status"],state.get("progress"),flush=True)
              if state["status"]=="READY":break
              if state["status"]=="FAILED":raise RuntimeError("v5 Remotion worker rejected render: "+str(state.get("error")))
              time.sleep(10)
          else: raise TimeoutError("v5 preview not finished in test window; original remains unaffected")
          assert state["durationInFrames"]==cursor
          req=urllib.request.Request(BASE+"/api/v1/remotion/renders/"+rid+"/video",
              headers={"Range":"bytes=0-63"})
          with urllib.request.urlopen(req,timeout=50) as r:
              assert r.status in (200,206)
              assert b"ftyp" in r.read(64),"No valid MP4"
          fresh=get("/api/v1/voice-clips?scriptRevision="+str(rev))
          check=sorted((x for x in fresh if x.get("shotKey")=="SHOT 05"),key=lambda x:x["sequence"])
          assert [(x["clipKey"],x["generationRevision"],x["approved"]) for x in check]==[
             (x["clipKey"],x["generationRevision"],x["approved"]) for x in clips]
          print("SHOT05 CLEAR GATEWAY INTRO MP4 READY",rid,"frames",cursor,"bytes",state.get("sizeBytes"),flush=True)
          print("MP4_URL",BASE+"/api/v1/remotion/renders/"+rid+"/video",flush=True)
          print("SAFE: 7 approved audio sources unchanged; C07 reused twice at measured silence. SHOT01-04 untouched. No Director LOCK.",flush=True)
          PY
