name: SHOT06 Verify And Publish Already Rendered Director v2 MP4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shot06-publish-rendered-director-v2-mp4.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: shot06-director-v2-2026-10-21
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the actual full rendered MP4 from the verified workflow artifact
        shell: bash
        run: |
          gh run download 39592721958 -R stefanVasilev17/media-os -n SHOT06-Director-v2-Full-MP4-and-QA -D .
          test -s out/SHOT06_LoadBalancer_Director_v2.mp4
          stat -c 'ORIGINAL_RENDER_MP4_BYTES %s' out/SHOT06_LoadBalancer_Director_v2.mp4
      - name: Verify H264 AAC duration original audio streams and representative video frames
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python3 - <<'PY'
          import json,os,subprocess
          path="out/SHOT06_LoadBalancer_Director_v2.mp4"
          data=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",path]))
          video=next(x for x in data["streams"] if x["codec_type"]=="video")
          audio=next(x for x in data["streams"] if x["codec_type"]=="audio")
          seconds=float(data["format"]["duration"])
          assert video["width"]==1280 and video["height"]==720,video
          assert video["r_frame_rate"]=="30/1",video
          assert 171.0<seconds<171.6,seconds
          assert video["codec_name"]=="h264" and audio["codec_name"]=="aac"
          assert os.path.getsize(path)>8_000_000
          print("DIRECTOR_V2_VIDEO_METADATA_PASS",json.dumps({
            "durationSeconds":seconds,"width":video["width"],"height":video["height"],
            "fps":video["r_frame_rate"],"audio":audio["codec_name"],
            "video":video["codec_name"],"bytes":os.path.getsize(path)}),flush=True)
          for point in [8,28,38,45,60,73,82,90,103,113,127,137,150,169]:
              shot=subprocess.check_output(["ffmpeg","-nostdin","-loglevel","error","-ss",str(point),
                "-i",path,"-frames:v","1","-vf","scale=640:360","-f","image2pipe","-vcodec","mjpeg","pipe:1"])
              assert shot[:2]==b"\xff\xd8",point
              print("FRAME_PASS",point,flush=True)
          PY
      - name: Publish MP4 as a Director-only prerelease
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/SHOT06_LoadBalancer_Director_v2.mp4 --clobber
          else
            gh release create "$TAG" out/SHOT06_LoadBalancer_Director_v2.mp4 \
              --title "EP001 SHOT06 Load Balancer — Director Preview v2" \
              --notes "Full 171.233-second H264/AAC video, seven original Director-approved ElevenLabs recordings, revised native animation with luminous multicolor packet streams, Round Robin, contained instance cards, healthy-only handoff to Auth Service. Director review only — NOT LOCKED. SHOT 01–05 untouched." \
              --prerelease
          fi
          gh release view "$TAG" --json url,assets --jq '{url:.url,assets:[.assets[]|{name:.name,url:.url,size:.size}]}'
          echo 'DIRECTOR_V2_MP4_PUBLISHED_AND_VERIFIED; SHOT06_NOT_LOCKED'
