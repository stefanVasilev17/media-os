name: EP001 SHOT05 C01 v3 approved narrator correction
# The existing Director C01 voice override conflicts with v3 promotion.
# This preservation-sensitive workflow is manual-only until Director review.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ep001-shot05-c01-director-v3
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Apply immutable v3 C01 script, HEAR/SEE and generate one voice draft
        run: python3 ops/shot05-v3/promote.py
