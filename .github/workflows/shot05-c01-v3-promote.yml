name: EP001 SHOT05 C01 v3 approved narrator correction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shot05-c01-v3-promote.yml'
      - 'ops/shot05-v3/promote.py'
permissions:
  contents: read
concurrency:
  group: ep001-shot05-c01-director-v3
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Apply immutable v3 C01 script, HEAR/SEE and generate one voice draft
        run: python3 ops/shot05-v3/promote.py
