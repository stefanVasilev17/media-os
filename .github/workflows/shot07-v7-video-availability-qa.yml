name: SHOT07 v7 Director video availability QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shot07-v7-video-availability-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ready-video:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact v7 MP4 endpoint and stream
        shell: bash
        run: |
          set -euo pipefail
          url="https://media-os-backend-production.up.railway.app/api/v1/remotion/renders/bdeab4a8-70df-4995-9b28-b72a473d780b/video"
          curl -fSL --connect-timeout 15 --max-time 100 "$url" -o shot07_v7.mp4
          test "$(stat -c%s shot07_v7.mp4)" -gt 3000000
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 shot07_v7.mp4 | grep -q '^1920,1080$'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 shot07_v7.mp4 | grep -q '[a-z]'
          echo "SHOT07 V7 VIDEO READY: MP4 available, 1920x1080 and audio present."
