name: MediaOS Worker Credential Release CI

on:
  pull_request:
    paths:
      - 'remotion-engine/cpu-worker.mjs'
      - 'remotion-engine/cpu-worker-lease.mjs'
      - 'remotion-engine/cpu-worker-lease.test.mjs'
      - 'remotion-engine/worker-token-rotation.mjs'
      - 'remotion-engine/worker-token-rotation.test.mjs'
      - 'backend/src/main/java/com/architecturalthinking/mediaos/system/CpuWorkerCredentialLeaseController.java'
      - 'backend/src/main/java/com/architecturalthinking/mediaos/system/WorkloadSecurityConfiguration.java'
      - 'backend/src/main/java/com/architecturalthinking/mediaos/system/WorkloadIdentityFilter.java'
      - 'backend/src/test/java/com/architecturalthinking/mediaos/system/**'
      - '.github/workflows/worker-credential-release-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate worker source
        run: |
          node --check remotion-engine/cpu-worker.mjs
          node --check remotion-engine/cpu-worker-lease.mjs
          node --check remotion-engine/worker-token-rotation.mjs
      - name: Run token rotation and automatic lease tests
        run: node --test remotion-engine/worker-token-rotation.test.mjs remotion-engine/cpu-worker-lease.test.mjs

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compile production backend
        working-directory: backend
        run: mvn -B -ntp -DskipTests package
      - name: Security guard unit tests
        working-directory: backend
        run: mvn -B -ntp -Dtest=WorkloadSecurityModeCompatibilityTest,WorkloadCredentialOfflineAdminTest,WorkloadHttpAuthorizationTest test
